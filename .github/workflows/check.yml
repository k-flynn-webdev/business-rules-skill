name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill agrees with itself
        run: ./scripts/check.sh

  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [journal-app, quote-app]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - name: Installs, type-checks and tests
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Ledger index is current
        run: npm run ledger:verify
